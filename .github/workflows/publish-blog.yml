name: Convert Obsidian to Hugo and Deploy

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'prepare_for_hugo.py'

jobs:
  convert-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install pyyaml
          
      - name: Run prepare_for_hugo script
        run: |
          python prepare_for_hugo.py \
            --posts-dir content/posts \
            --backup-dir obsidian_originals \
            --live
          
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/posts/**/*.md obsidian_originals/
          git commit -m "Auto-convert: Obsidian → Hugo format [skip ci]"
          git push